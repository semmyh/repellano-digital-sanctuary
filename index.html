<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repellano Digital Sanctuary</title>
    <!-- Official Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --panel-bg: #111827;
            --accent-blue: #3b82f6;
            --accent-glow: #60a5fa;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: #1f2937;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .shield-wrapper {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(0,0,0,0) 70%);
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        .shield-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 12px var(--accent-glow));
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
        }

        .description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 24px 0;
            padding: 0 10px;
        }

        .button-frame-group {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            width: 100%;
            padding: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .menu-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.08);
        }

        .btn-title {
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .btn-subtitle {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="shield-wrapper">
            <div class="shield-icon">🛡️</div>
        </div>

        <h1>Welcome To The Sanctuary</h1>
        <div class="description">Before you enter, choose your language to listen to the Sanctuary's anthem.</div>
        
        <!-- Both buttons route directly to @RDSTracks with no background scripts to crash -->
        <div class="button-frame-group">
            <div class="menu-btn" onclick="routeToChannel()">
                <div class="btn-title">English Version</div>
                <div class="btn-subtitle">Listen in English</div>
            </div>
            
            <div class="menu-btn" onclick="routeToChannel()">
                <div class="btn-title">Pidgin Version</div>
                <div class="btn-subtitle">Listen in Pidgin</div>
            </div>
        </div>
    </div>

    <script>
        // Direct routing trigger
        function routeToChannel() {
            const tg = window.Telegram?.WebApp;
            const targetUrl = "https://t.me";
            
            if (tg && typeof tg.openTelegramLink === "function") {
                tg.openTelegramLink(targetUrl);
            } else {
                window.open(targetUrl, "_blank");
            }
        }
    </script>
</body>
</html>
